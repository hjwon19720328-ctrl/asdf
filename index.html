<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ω등급 문서 열람</title>
    <style>
        /* 전체 배경 설정 */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; /* 초기 화면에서는 스크롤 방지 */
        }

        /* 초기 경고 화면 컨테이너 */
        #intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
        }

        /* 배경에서 쏟아지는 이상한 코드 */
        #strange-code {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            font-size: 14px;
            line-height: 1.2;
            opacity: 0.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 10px;
            text-align: left;
            z-index: 1;
        }

        /* 경고창 박스 */
        #warning-box {
            display: none;
            z-index: 10;
            background: rgba(20, 0, 0, 0.85);
            border: 2px solid #ff0033;
            padding: 40px;
            max-width: 600px;
            color: #ff0033;
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.4);
            animation: glitch-box 3s infinite;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8em;
            letter-spacing: 2px;
        }

        .omega {
            font-size: 4em;
            margin: 0;
            display: block;
            text-shadow: 0 0 10px #ff0033;
        }

        /* 열람하기 버튼 */
        button {
            margin-top: 30px;
            padding: 12px 40px;
            background-color: transparent;
            color: #ff0033;
            border: 1px solid #ff0033;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.2em;
            transition: all 0.3s;
        }

        button:hover {
            background-color: #ff0033;
            color: #000;
            box-shadow: 0 0 15px #ff0033;
        }

        /* 실제 문서 내용 */
        #main-content {
            display: none;
            color: #dddddd;
            padding: 50px;
            font-family: 'Malgun Gothic', sans-serif;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 약간의 불안정한 느낌을 주는 글리치 효과 */
        @keyframes glitch-box {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 1px) }
            40% { transform: translate(-1px, -1px) }
            60% { transform: translate(2px, 1px) }
            80% { transform: translate(1px, -1px) }
            100% { transform: translate(0) }
        }
    </style>
</head>
<body>

    <!-- 초기 화면 (코드 + 경고창) -->
    <div id="intro-container">
        <!-- 이상한 코드가 출력될 영역 -->
        <div id="strange-code"></div>

        <!-- 오메가 등급 경고창 -->
        <div id="warning-box">
            <span class="omega">Ω</span>
            <h1>경고: 특수 보안 등급 문서</h1>
            <p>본 문서는 <strong>Ω(오메가) 등급</strong> 보안 인가가 필요합니다.</p>
            <p>비인가자의 열람은 엄격히 금지되며, 열람 시 발생하는<br>모든 정신적, 신체적 피해 및 재해에 대하여<br>재단은 어떠한 책임도 지지 않습니다.</p>
            <button id="view-btn">열람하기</button>
        </div>
    </div>

    <!-- 메인 문서 내용 (열람하기 누른 후 등장) -->
    <div id="main-content">
        <h2>문서 번호: 기밀-Ω-778</h2>
        <hr>
        <p>인가 확인 완료. 환영합니다.</p>
        <p>여기에 캐릭터 프로필, SCP 설정, 혹은 다크 판타지 세계관에 맞는 본문 내용을 작성하시면 됩니다.</p>
    </div>

    <script>
        const codeContainer = document.getElementById('strange-code');
        const warningBox = document.getElementById('warning-box');
        const introContainer = document.getElementById('intro-container');
        const mainContent = document.getElementById('main-content');
        const viewBtn = document.getElementById('view-btn');

        // 무작위 특수기호 및 문자열 생성기
        function generateCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+{}|:"<>?~`Ω';
            let text = '';
            for (let i = 0; i < 3000; i++) {
                text += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return text;
        }

        // 0.1초마다 무작위 코드 화면 갱신 (해킹/오류 연출)
        let codeInterval = setInterval(() => {
            codeContainer.innerText = generateCode();
        }, 100);

        // 2초 뒤에 코드 생성을 멈추고 경고창 띄우기
        setTimeout(() => {
            clearInterval(codeInterval);
            codeContainer.style.opacity = '0.15'; // 코드는 뒷배경으로 희미하게 남김
            warningBox.style.display = 'block'; // 경고창 표시
        }, 2000);

        // 열람하기 버튼 클릭 시
        viewBtn.addEventListener('click', () => {
            // 페이드 아웃 효과
            introContainer.style.transition = 'opacity 1s ease-in-out';
            introContainer.style.opacity = '0';
            
            // 1초 뒤 완전히 숨기고 메인 화면 표시, 스크롤 활성화
            setTimeout(() => {
                introContainer.style.display = 'none';
                mainContent.style.display = 'block';
                document.body.style.overflow = 'auto'; // 스크롤 다시 생김
                document.body.style.backgroundColor = '#111'; // 메인 문서 배경색 변경
            }, 1000);
        });
    </script>
</body>
</html>
